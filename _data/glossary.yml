- title: "Моно-но аварэ"
  japanese: "物の哀れ — «печальное очарование вещей»"
  category: "Эстетика и философия"
  description: "Эстетический принцип японской культуры, обозначающий светлую грусть от осознания быстротечности и хрупкости всего прекрасного в мире. В аниме передается через кадры опадающей сакуры, уходящих поездов и финал летних каникул."

- title: "Камикакуси"
  japanese: "神隠し — «похищение богами»"
  category: "Фольклор и мифология"
  description: "Традиционное японское поверье, объясняющее внезапное и бесследное исчезновение человека вмешательством горных духов или божеств ками. В аниме этот мотив служит основой для сюжетов о попадании героев в потусторонний мир («Унесенные призраками»)."

- title: "Манпу"
  japanese: "漫符 — «знаки манги»"
  category: "Визуальные коды (Манпу)"
  description: "Устоявшаяся система графических метафор и пиктограмм в манге и аниме (капля пота на виске, крестик вен на лбу, призрачные эктоплазмы), визуализирующих внутреннее эмоциональное состояние персонажа."

- title: "Хоннэ и татэмаэ"
  japanese: "本音と建前 — «истинный звук» и «фасад»"
  category: "Эстетика и философия"
  description: "Социокультурная дихотомия в Японии, разделяющая истинные чувства человека (хоннэ) и его социально одобряемое публичное поведение ради сохранения гармонии в коллективе (татэмаэ)."

- title: "Ёкай"
  japanese: "妖怪 — «сверхъестественное явление, дух»"
  category: "Фольклор и мифология"
  description: "Собирательное название сверхъестественных существ японского фольклора — от оборотней (кицунэ, тануки) до демонов (они) и оживших предметов (цукумогами)."

- title: "Ваби-саби"
  japanese: "侘寂 — «скромная простота и патина времени»"
  category: "Эстетика и философия"
  description: "Эстетическое мировоззрение, находящее красоту в несовершенстве, асимметрии и следах естественного старения вещей. В аниме определяет визуальный стиль заброшенных храмов, старых домов и эстетику уединения («Мастер муси»)."

- title: "Цундэрэ"
  japanese: "ツンデレ — от «цун-цун» (колючий) и «дэрэ-дэрэ» (нежный)"
  category: "Архетипы и тропы"
  description: "Устойчивый архетип персонажа, скрывающего искреннюю привязанность и уязвимость за маской враждебности и высокомерия. В визуальной семиотике аниме считывается по характерному дизайну (прическа с двумя хвостиками, прищур глаз)."

- title: "Ма"
  japanese: "間 — «промежуток, пауза, пустое пространство»"
  category: "Эстетика и философия"
  description: "Концепция осмысленной пустоты и паузы в японском искусстве, где тишина несет не меньше смысла, чем действие. В режиссуре аниме приемом «ма» называют длинные статичные кадры природы или молчаливые поездки в поезде (работы Хаяо Миядзаки)."

- title: "Югэн"
  japanese: "幽玄 — «сокровенная глубина, тайная красота»"
  category: "Эстетика и философия"
  description: "Эстетическая категория, обозначающая неуловимую, скрытую от глаз тайну мироздания, на которую можно лишь намекнуть. В анимации выражается через туманные горные пейзажи и недосказанность в финале («Ангельское яйцо»)."

- title: "Кицунэ"
  japanese: "狐 — «лисица-оборотень»"
  category: "Фольклор и мифология"
  description: "Мифологическое существо японского фольклора, обладающее высоким интеллектом, магией иллюзий и способностью принимать облик человека. В синтоизме белые лисицы считаются посланниками божества Инари («Очень приятно, Бог»)."

- title: "Тэнгу"
  japanese: "天狗 — «небесная собака»"
  category: "Фольклор и мифология"
  description: "Горный дух или лесной демон из японских легенд, изображаемый с красным лицом, длинным носом, крыльями и веером из перьев. В аниме тэнгу часто выступают как строгие наставники боевых искусств («Клинок, рассекающий демонов»)."

- title: "Они"
  japanese: "鬼 — «демон, огр»"
  category: "Фольклор и мифология"
  description: "Крупные клыкастые и рогатые демоны-людоеды в тигровых набедренных повязках с железной палицей канабо. В современной поп-культуре образ «они» трансформировался от абсолютного зла до трагических или комедийных персонажей («Re:Zero»)."

- title: "Синигами"
  japanese: "死神 — «бог смерти»"
  category: "Фольклор и мифология"
  description: "Персонификация смерти в японской культуре, возникшая на стыке буддийских представлений и западного образа Жнеца. В аниме синигами часто представлены как бюрократы загробного мира («Тетрадь смерти», «Блич»)."

- title: "Кудэрэ"
  japanese: "クーデレ — от англ. «cool» (холодный) и «дэрэ» (нежный)"
  category: "Архетипы и тропы"
  description: "Архетип персонажа, сохраняющего ледяное спокойствие, отстраненность и полное отсутствие эмоций на лице даже в критических ситуациях. Символом этого типажа стала Рей Аянами из «Евангелиона»."

- title: "Яндэрэ"
  japanese: "病んでれ — от «яндэру» (быть нездоровым) и «дэрэ» (влюбленный)"
  category: "Архетипы и тропы"
  description: "Архетип персонажа, чья влюбленность перерастает в болезненную одержимость, гиперконтроль и склонность к насилию ради объекта чувств. Визуально маркируется расфокусированными глазами и контрастом милой улыбки с угрожающей аурой."

- title: "Тиби (Чиби)"
  japanese: "縮み / ちび — «маленький, коротышка»"
  category: "Визуальные коды (Манпу)"
  description: "Стилистический прием резкого упрощения и уменьшения пропорций персонажа (огромная голова и крошечное туловище). Используется как визуальный знак для переключения сцены в комедийный или пародийный регистр."

- title: "Ахогэ"
  japanese: "アホ毛 — «глупый волосок»"
  category: "Визуальные коды (Манпу)"
  description: "Отдельная непослушная прядь волос, торчащая на макушке персонажа и двигающаяся как антенна в такт его эмоциям. Маркирует наивность, простодушие или энергичность героя."

- title: "Кэмономими"
  japanese: "獣耳 — «звериные ушки»"
  category: "Визуальные коды (Манпу)"
  description: "Дизайнерский троп наделения человекоподобных персонажей ушами и хвостами животных (кошек, лисиц, волков). Сочетает антропоморфную миловидность с отсылками к синтоистскому анимизму («Волчица и пряности»)."

- title: "Сэмпай и кохай"
  japanese: "先輩と後輩 — «старший и младший товарищ»"
  category: "Эстетика и философия"
  description: "Базовая модель конфуцианской иерархии в японском обществе, регулирующая отношения между опытным наставником (сэмпай) и новичком (кохай) в школе, клубе или на работе."

- title: "Махо-сёдзё"
  japanese: "魔法少女 — «девочка-волшебница»"
  category: "Архетипы и тропы"
  description: "Культовый архетип и поджанр, в котором обычная школьница получает магический артефакт и способность трансформироваться для борьбы со злом («Сейлор Мун», «Девочка-волшебница Мадока»)."

- title: "Каппа"
  japanese: "河童 — «речное дитя»"
  category: "Фольклор и мифология"
  description: "Водяной ёкай из японского фольклора, напоминающий помесь черепахи и лягушки с блюдцем воды на макушке, в котором заключена его жизненная сила. В аниме каппа символизируют связь человека с экологией водоемов и уважение к древним договорам с природой («Лето с Ку», «Гинтама»)."

- title: "Цукумогами"
  japanese: "付喪神 — «дух-артефакт»"
  category: "Фольклор и мифология"
  description: "Синтоистское поверье, согласно которому любой предмет быта (зонт, фонарь, меч или чашка), прослуживший ровно сто лет, обретает душу и самосознание. В аниме этот мотив используется для критики общества потребления и бережного отношения к вещам («Мононокэ», «Цугумомо»)."

- title: "Юрэй"
  japanese: "幽霊 — «туманный дух, призрак»"
  category: "Фольклор и мифология"
  description: "Души умерших, которые не смогли обрести покой из-за насильственной смерти, невыполненного долга или сильной привязанности. Визуальный код юрэй в аниме включает белое погребальное кимоно, длинные распущенные черные волосы и блуждающие огоньки хитодама вокруг («Звонок», «Иная»)."

- title: "Оммёдзи"
  japanese: "陰陽師 — «мастер Инь и Ян»"
  category: "Фольклор и мифология"
  description: "Исторические придворные маги и астрологи эпохи Хэйан, практиковавшие эзотерическую космологию оммёдо для защиты от злых духов. В современном аниме оммёдзи стали главным архетипом экзорцистов, использующих бумажные талисманы офуда и призывающих духов-служителей сикигами («Магическая битва», «Токийские вороны»)."

- title: "Бакемоно"
  japanese: "化け物 — «меняющее облик существо»"
  category: "Фольклор и мифология"
  description: "Класс оборотней в японской демонологии (от кошек бакэнэко до енотовидных собак тануки), способных принимать облик людей или неодушевленных предметов. В анимации образ бакемоно часто служит метафорой двойственности человеческой натуры («Помпоко: Война тануки», «Истории монстров»)."

- title: "Кодама"
  japanese: "木霊 — «дух дерева, эхо»"
  category: "Фольклор и мифология"
  description: "Лесные духи в синтоизме, обитающие в старых деревьях и отвечающие за горное эхо. Знаменитый визуальный образ кодама — белые полупрозрачные человечки с пощелкивающими головами — был создан Хаяо Миядзаки в «Принцессе Мононоке»."

- title: "Нидзюкко (Ками-бумага)"
  japanese: "紙 — «лимитированная анимация (на 2-х или 3-х кадрах)»"
  category: "Визуальные коды (Манпу)"
  description: "Специфический для аниме технический прием, при котором рисунок обновляется не 24 раза в секунду, а каждые 2 или 3 кадра (12 или 8 рисунков в секунду). Этот прием стал осознанным художественным языком, придающим движениям характерную резкость и графическую выразительность."

- title: "Сакуга"
  japanese: "作画 — «рисунок, ключевая анимация»"
  category: "Визуальные коды (Манпу)"
  description: "Термин, которым в культуре аниме обозначают кульминационные сцены с исключительно высокой детализацией, плавностью движений и сложной работой камеры. Визуально сакуга маркируется ослаблением контурных линий, искажением перспективы и максимальной динамикой («Моб Психо 100»)."

- title: "Спидлайны (Сюсюсэн)"
  japanese: "集中線 — «линии концентрации»"
  category: "Визуальные коды (Манпу)"
  description: "Графический прием из манги, перенесенный в аниме: резкие черные или белые полосы, сходящиеся к центру кадра или двигающиеся по фону. Используются как визуальный ускоритель, передающий головокружительную скорость, внезапное озарение или психологический шок героя."

- title: "Ударный кадр (Импакт-фрейм)"
  japanese: "インパクトフレーム — «кадр удара»"
  category: "Визуальные коды (Манпу)"
  description: "Одиночный кадр длительностью в 1/24 секунды, вставляемый в момент мощного взрыва или удара, где изображение резко инвертируется в черно-белый контраст или абстрактные геометрические вспышки. Подсознательно усиливает для зрителя ощущение физической мощи столкновения."

- title: "Кадр-подушка (Pillow Shot)"
  japanese: "ピロー・ショット — «кадр-пауза»"
  category: "Эстетика и философия"
  description: "Кинематографический прием, заимствованный аниме у классического японского режиссера Ясудзиро Одзу: вставка статичного пейзажа, электрических проводов, светофора или пустой комнаты между диалогами. Создает эмоциональную передышку («Евангелион», «Твое имя»)."

- title: "Обаке-кадр (Смир-фрейм)"
  japanese: "お化け — «призрачный размытый кадр»"
  category: "Визуальные коды (Манпу)"
  description: "Промежуточный кадр в быстрой анимации, где конечности или лицо персонажа намеренно рисуются искаженными, вытянутыми или размноженными. При просмотре на обычной скорости человеческий глаз не замечает деформации, но считывает невероятную плавность и инерцию движения."

- title: "Сайлент-мимика (Потеря деталей лица)"
  japanese: "記号化 — «символическое упрощение»"
  category: "Визуальные коды (Манпу)"
  description: "Резкое падение детализации лица персонажа до простых точек вместо глаз и черточки вместо рта в момент растерянности или неловкости. Этот визуальный код мгновенно отключает драматический пафос и переводит сцену в режим самоиронии."

- title: "Театральный свет (Символизм тени)"
  japanese: "影の演出 — «режиссура тени»"
  category: "Визуальные коды (Манпу)"
  description: "Прием, при котором верхняя половина лица персонажа закрывается густой вертикальной тенью (часто с отблеском очков), а рот остается освещенным. В семиотике аниме это безошибочный знак скрытых мотивов, подавленной ярости или готовности героя к коварному поступку."

- title: "Трикстер"
  japanese: "トリックスター — «плут, нарушитель порядка»"
  category: "Архетипы и тропы"
  description: "Мифологический и сюжетный архетип хитреца и бунтаря, который нарушает установленные правила, высмеивает авторитеты и запускает цепь непредсказуемых событий. В аниме трикстеры часто выступают катализаторами развития главного героя (Сатору Годзё в «Магической битве»)."

- title: "Ментор-отшельник"
  japanese: "隠遁した師匠 — «наставник на покое»"
  category: "Архетипы и тропы"
  description: "Классический архетип пожилого или эксцентричного мастера, обладающего тайным знанием, но скрывающего свою силу за маской чудаковатости или лени. Выполняет функцию проводника героя через обряд инициации (Джирайя в «Наруто», Камадзи в «Унесенных призраками»)."
